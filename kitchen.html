<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>厨房モニター</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
    h1 { margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .auto-refresh { font-size: 0.8rem; color: #4caf50; }
    
    /* 管理エリア */
    .admin-panel { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .admin-box { flex: 1; min-width: 300px; background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #444; }
    .admin-title { font-weight: bold; margin-bottom: 10px; color: #81d4fa; display: flex; align-items: center; gap: 6px; }
    .admin-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .admin-form select, .admin-form input { padding: 8px; font-size: 1rem; border-radius: 4px; border: 1px solid #555; background: #333; color: #fff; }

    .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
    .order-card { background-color: #1e1e1e; border-radius: 8px; border-left: 6px solid #ff9800; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
    .order-card.checkout-req { border-left-color: #e91e63; background-color: #2c121a; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .table-badge { font-size: 1.2rem; font-weight: bold; color: #fff; background: #333; padding: 2px 8px; border-radius: 4px; }
    .order-time { font-size: 0.9rem; color: #aaa; }
    .menu-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 8px; word-break: break-all; }
    .menu-qty { font-size: 1.5rem; color: #ffeb3b; font-weight: bold; text-align: right; }
    .btn-group { display: flex; gap: 8px; margin-top: 15px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
    .btn-done { background-color: #4caf50; color: white; }
    .btn-cancel { background-color: #f44336; color: white; }
    .btn-add { background: #2196f3; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-soldout { background: #ff9800; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn:disabled, .btn-add:disabled, .btn-soldout:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>
    🍳 厨房モニター
    <span class="auto-refresh">● 自動更新中 (5秒)</span>
  </h1>

  <div class="admin-panel">
    <!-- 口頭注文パネル -->
    <div class="admin-box">
      <div class="admin-title">➕ 口頭注文の代理入力</div>
      <div class="admin-form">
        <select id="oral-table">
          <optgroup label="カウンター">
            <option value="1">カウンター 1番席</option>
            <option value="2">カウンター 2番席</option>
            <option value="3">カウンター 3番席</option>
            <option value="4">カウンター 4番席</option>
            <option value="5">カウンター 5番席</option>
            <option value="6">カウンター 6番席</option>
            <option value="7">カウンター 7番席</option>
            <option value="8">カウンター 8番席</option>
            <option value="9">カウンター 9番席</option>
            <option value="10">カウンター 10番席</option>
          </optgroup>
          <optgroup label="テーブル">
            <option value="T1">テーブル T1</option>
            <option value="T2">テーブル T2</option>
            <option value="T3">テーブル T3</option>
          </optgroup>
        </select>
        <select id="oral-menu">
          <option value="">メニューを選択...</option>
        </select>
        <input type="number" id="oral-qty" value="1" min="1" max="10" style="width: 60px;">
        <button class="btn-add" id="btn-submit-oral" onclick="submitOralOrder()">注文追加</button>
      </div>
    </div>

    <!-- 品切れ切り替えパネル -->
    <div class="admin-box">
      <div class="admin-title">🚫 品切れ設定・解除</div>
      <div class="admin-form">
        <select id="soldout-menu">
          <option value="">メニューを選択...</option>
        </select>
        <button class="btn-soldout" id="btn-toggle-soldout" onclick="toggleSoldOut()">状態を切替</button>
      </div>
    </div>
  </div>

  <div class="order-grid" id="order-grid">
    <p style="color:#aaa;">注文データを読み込み中...</p>
  </div>

  <script src="js/config.js"></script>
  <script>
let allMenusCache = [];

window.onload = () => {
  loadKitchenData();
  setInterval(loadKitchenData, CONFIG.REFRESH_INTERVAL);
};

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatTableName(tableId) {
  if (!tableId) return '未設定';
  const cleanId = String(tableId).trim();
  if (/^T\d+$/i.test(cleanId)) return `テーブル ${cleanId.toUpperCase()}`;
  if (!isNaN(cleanId)) return `カウンター ${cleanId}番席`;
  return `${cleanId}番卓`;
}

function loadKitchenData() {
  fetch(`${CONFIG.GAS_URL}?mode=kitchen&_t=${Date.now()}`)
    .then(res => res.json())
    .then(data => {
      // 開発者ツールのコンソールにレスポンス構造を出力（確認用）
      console.log("厨房データ受信:", data);

      // menus または menuList や items など、様々なキーに対応
      const menusList = data.menus || data.menuList || data.items || [];

      if (Array.isArray(menusList) && menusList.length > 0) {
        allMenusCache = menusList;
        updateMenuSelects(menusList);
      } else {
        console.warn("メニューデータが空または取得できませんでした:", data);
      }

      renderOrders(data.orders || data.orderList || []);
    })
    .catch(err => console.error("データ取得エラー:", err));
}

// 厨房モニター HTML内：メニューセレクトボックスの更新
function updateMenuSelects(menus) {
  const oralSelect = document.getElementById('oral-menu');
  const soldoutSelect = document.getElementById('soldout-menu');
  
  if (!oralSelect || !soldoutSelect) return;

  const currentOral = oralSelect.value;
  const currentSoldout = soldoutSelect.value;

  oralSelect.innerHTML = '<option value="">メニューを選択...</option>';
  soldoutSelect.innerHTML = '<option value="">メニューを選択...</option>';

  // カテゴリーごとにメニューをグループ化
  const groupedMenus = {};
  menus.forEach(m => {
    const cat = m.category || m.category_name || 'その他';
    if (!groupedMenus[cat]) groupedMenus[cat] = [];
    groupedMenus[cat].push(m);
  });

  // グループごとに <optgroup> を生成
  Object.keys(groupedMenus).forEach(cat => {
    const optGroupOral = document.createElement('optgroup');
    optGroupOral.label = `--- ${cat} ---`;

    const optGroupSold = document.createElement('optgroup');
    optGroupSold.label = `--- ${cat} ---`;

    groupedMenus[cat].forEach(m => {
      const id = m.menu_id ?? m.menuId ?? m.id;
      const name = m.name ?? m.menu_name ?? m.menuName ?? '名称未設定';
      const price = (m.price !== undefined && m.price !== '') ? `${m.price}円` : '';
      const isSoldOut = Boolean(
        m.is_sold_out || m.is_out_of_stock || m.isSoldOut || m.outOfStock || m.sold_out
      );

      if (!id) return;

      // 口頭注文用
      const optOral = document.createElement('option');
      optOral.value = id;
      optOral.textContent = `${name} ${price ? `(${price})` : ''}${isSoldOut ? ' [品切れ中]' : ''}`;
      optGroupOral.appendChild(optOral);

      // 品切れ切替用
      const optSoldout = document.createElement('option');
      optSoldout.value = id;
      optSoldout.dataset.isSoldOut = isSoldOut ? 'true' : 'false';
      optSoldout.textContent = `${isSoldOut ? '【品切れ中】' : '【販売中】'} ${name}`;
      optGroupSold.appendChild(optSoldout);
    });

    oralSelect.appendChild(optGroupOral);
    soldoutSelect.appendChild(optGroupSold);
  });

  oralSelect.value = currentOral;
  soldoutSelect.value = currentSoldout;
}

function renderOrders(orders) {
  const grid = document.getElementById('order-grid');
  if (!grid) return;
  grid.innerHTML = '';

  const activeOrders = orders.filter(order => {
    const st = String(order.status || '').trim();
    return !(st.includes('提供') || st === '完了' || st === 'キャンセル' || st === '削除' || st === '会計済');
  });

  if (activeOrders.length === 0) {
    grid.innerHTML = '<p style="color:#aaa; grid-column: 1/-1; text-align:center; padding: 40px 0;">現在、未対応の注文はありません。</p>';
    return;
  }

  activeOrders.forEach(order => {
    const card = document.createElement('div');
    const isCheckout = (order.status === '会計要請');
    card.className = `order-card ${isCheckout ? 'checkout-req' : ''}`;
    card.dataset.orderId = order.orderId;
    card.dataset.menuName = order.menuName;

    const displayName = formatTableName(order.tableId);

    let actionBtns = '';
    if (isCheckout) {
      actionBtns = `<div style="color:#e91e63; font-weight:bold; text-align:center; padding:10px; font-size:1.2rem;">🚶‍♂️ お会計の呼び出し</div>`;
    } else {
      actionBtns = `
        <div class="btn-group">
          <button class="btn btn-done" onclick="updateStatus('${escapeHtml(order.orderId)}', '提供済')">提供済</button>
          <button class="btn btn-cancel" onclick="updateStatus('${escapeHtml(order.orderId)}', 'キャンセル')">取消</button>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="card-header">
        <span class="table-badge">${escapeHtml(displayName)}</span>
        <span class="order-time">${escapeHtml(order.time)}</span>
      </div>
      <div class="menu-name">${escapeHtml(order.menuName)}</div>
      <div class="menu-qty">× ${escapeHtml(order.quantity)}</div>
      ${actionBtns}
    `;
    grid.appendChild(card);
  });
}

    function updateStatus(orderId, status) {
      const params = new URLSearchParams();
      params.append('action', 'update_status');
      params.append('orderId', orderId);
      params.append('status', status);

      fetch(CONFIG.GAS_URL, {
        method: 'POST',
        body: params,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          showToast(`${status}に更新しました`);
          loadKitchenData();
        } else {
          showToast("エラー: " + res.message, true);
        }
      })
      .catch(err => showToast("通信に失敗しました", true));
    }

    function submitOralOrder() {
      const tableId = document.getElementById('oral-table').value;
      const menuId = document.getElementById('oral-menu').value;
      const quantity = document.getElementById('oral-qty').value;
      const btn = document.getElementById('btn-submit-oral');

      if (!menuId) {
        showToast("メニューを選択してください", true);
        return;
      }

      btn.disabled = true;

      const params = new URLSearchParams();
      params.append('tableId', tableId);
      params.append('menuId', menuId);
      params.append('quantity', quantity);

      fetch(CONFIG.GAS_URL, {
        method: 'POST',
        body: params,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          showToast("口頭注文を追加しました");
          document.getElementById('oral-menu').value = '';
          document.getElementById('oral-qty').value = '1';
          loadKitchenData();
        } else {
          showToast("エラー: " + res.message, true);
        }
      })
      .catch(err => showToast("通信に失敗しました", true))
      .finally(() => {
        btn.disabled = false;
      });
    }

    // 品切れ状態の切り替え関数
function toggleSoldOut() {
  const select = document.getElementById('soldout-menu');
  const menuId = select.value;
  const btn = document.getElementById('btn-toggle-soldout');

  if (!menuId) {
    showToast("メニューを選択してください", true);
    return;
  }

  const selectedOption = select.options[select.selectedIndex];
  const currentSoldOut = selectedOption.dataset.isSoldOut === 'true';
  const newStatus = !currentSoldOut; // ON/OFF反転

  btn.disabled = true;

  const params = new URLSearchParams();
  params.append('action', 'toggle_out_of_stock'); 
  params.append('menuId', menuId);
  params.append('isSoldOut', newStatus);

  fetch(CONFIG.GAS_URL, {
    method: 'POST',
    body: params,
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === 'success') {
      showToast(newStatus ? "品切れに設定しました" : "販売を再開しました");
      loadKitchenData();
    } else {
      showToast("エラー: " + res.message, true);
    }
  })
  .catch(err => showToast("通信に失敗しました", true))
  .finally(() => {
    btn.disabled = false;
  });
}
    // トースト通知関数
    function showToast(message, isError = false) {
      const existing = document.getElementById("toast-popup");
      if (existing) existing.remove();

      const toast = document.createElement("div");
      toast.id = "toast-popup";
      toast.innerText = message;
      
      Object.assign(toast.style, {
        position: "fixed",
        bottom: "30px",
        left: "50%",
        transform: "translateX(-50%)",
        backgroundColor: isError ? "#f44336" : "#4caf50",
        color: "#ffffff",
        padding: "14px 28px",
        borderRadius: "8px",
        fontSize: "1.2rem",
        fontWeight: "bold",
        boxShadow: "0 4px 12px rgba(0,0,0,0.5)",
        zIndex: "9999",
        transition: "opacity 0.3s ease"
      });

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 1500);
    }
  </script>
</body>
</html>
